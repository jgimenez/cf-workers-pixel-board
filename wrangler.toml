name = "pixelboard-cf"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Public assets (frontend)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# AI binding
[ai]
binding = "AI"

# Browser Rendering
[browser]
binding = "BROWSER"

# Dynamic Workers — Worker Loader API for running AI-generated code
[[worker_loaders]]
binding = "LOADER"

# Self-referencing service binding so Dynamic Workers can call our own /api/pixel
[[services]]
binding = "SELF_SERVICE"
service = "pixelboard-cf"

# Observability
[observability.logs]
enabled = true
invocation_logs = true

# Durable Objects
[[durable_objects.bindings]]
name = "TILE"
class_name = "Tile"

[[durable_objects.bindings]]
name = "BOARD_HUB"
class_name = "BoardHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tile", "BoardHub"]

# Optional: Workers Rate Limiting binding as fallback to WAF Rate Limiting
# Uncomment if not using WAF Rate Limiting Rule
# [[unsafe.bindings]]
# name = "PAINT_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 1, period = 10 }

# Vars (public)
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAADPIuBLHGmnBG7mS"  # public, OK to commit
CF_TEAM_DOMAIN = "pixelboard-cf.cloudflarepeerpoint.workers.dev"  # e.g. "yourteam.cloudflareaccess.com" — leave empty to skip Access check (local dev)
CF_ACCESS_AUD = "5c198ca240562f531d8765da7c81ff698effdd422ae229be376c7cff9147adde"   # Application Audience tag from the Access application
CF_AI_GATEWAY_ID = "peerpoint"  # AI Gateway ID from Cloudflare dashboard → AI Gateway → your gateway name

# Secrets (set via `wrangler secret put`)
# - TURNSTILE_SECRET
# - SESSION_HMAC_SECRET
